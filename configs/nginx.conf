server {
    listen 80 default_server;

    location = /favicon.ico {
        alias /home/manti/www/odin/static/favicon.ico;
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /home/manti/www/odin/static/;

        if ($request_filename ~ "^.*/(.+\.(jpe?g|png|svg|avif|js|css|webm|mp4|pdf|ico|woff|woff2|json))$") {
            expires max;
            access_log off;

            add_header Pragma 'public';
            add_header Cache-Control 'public, must-revalidate, proxy-revalidate';
            add_header Access-Control-Allow-Origin *;
            break;
        }

        return 403;
    }

    location /media/ {
        alias /home/manti/www/odin/media/;

        if ($request_filename ~ "^.*/(.+\.(jpe?g|png|svg|avif|pdf))$") {
            expires max;
            access_log off;

            add_header Pragma 'public';
            add_header Cache-Control 'public, must-revalidate, proxy-revalidate';
            add_header Access-Control-Allow-Origin *;
            break;
        }

        return 403;
    }

    # Home video library: Django answers with X-Accel-Redirect and nginx streams the local
    # file with native HTTP Range support (Media3 seeks on the TV). `alias /` maps the media
    # URI 1:1 to the absolute path stored in the Video row, so every VIDEO_MEDIA_DIRS entry
    # works without its own location block. Trailers live in one known directory
    # (VIDEO_TRAILERS_DIR), so their location aliases it directly.
    location /video-media/ {
        internal;
        alias /;
    }

    location /video-trailers/ {
        internal;
        alias /var/lib/odin/trailers/;
    }

    location / {
        include /home/manti/www/odin/configs/proxy.params;
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 443 ssl http2 default_server;

    location = /favicon.ico {
        alias /home/manti/www/odin/static/favicon.ico;
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

