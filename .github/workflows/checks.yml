name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    name: Run Django checks

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: odin
          POSTGRES_PASSWORD: odin
          POSTGRES_DB: odin
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --locked --all-extras --dev

      - name: Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files

      - name: Check for missing migrations
        run: |
          uv run python manage.py makemigrations --dry-run --check --verbosity=3 --settings=odin.settings.sqlite

      - name: Run Django system checks
        run: |
          uv run python manage.py check --fail-level WARNING --settings=odin.settings.sqlite

      - name: Run Pytest suite
        run: |
          uv run pytest --create-db --disable-warnings --ds=odin.settings.test odin/

  frontend-checks:
    name: Run frontend checks

    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Biome lint
        working-directory: frontend
        run: bun run lint

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Build frontend
        working-directory: frontend
        run: bun run build
